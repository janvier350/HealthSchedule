; HealthSchedule — configuración de PHP por directorio (DirectAdmin / PHP-FPM/CGI).
; Sesión larga (24 h) para que no cierre sesión mientras se escribe una nota
; larga, cuando el navegador pasa mucho tiempo sin hacer peticiones al servidor.
;
;  - session.gc_maxlifetime: evita que PHP borre el archivo de sesión por
;    inactividad (por defecto suele ser ~1440 s = 24 min).
;  - session.cookie_lifetime: mantiene la cookie de sesión hasta 24 h.
;
; Los cambios en .user.ini pueden tardar unos minutos en aplicarse
; (user_ini.cache_ttl, por defecto 300 s).
session.gc_maxlifetime = 86400
session.cookie_lifetime = 86400
